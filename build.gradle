plugins {
    id 'java'
    id 'maven-publish'
    id 'com.gradleup.shadow' version '9.0.0'
}

group = 'net.sacredlabyrinth.phaed.simpleclans'
version = '2.19.3-SNAPSHOT'
description = 'SimpleClans'

// --- git describe (replaces the Maven git-commit-id plugin for plugin.yml) ---
def gitDescribeShort = {
    try {
        def out = providers.exec {
            commandLine 'git', 'describe', '--tags', '--always', '--dirty'
            ignoreExitValue = true
        }.standardOutput.asText.get().trim()
        // mimic git-commit-id's "describe-short": drop the -g<sha> segment (even before -dirty)
        def shortDesc = out.replaceAll(/-g[0-9a-f]{7,}/, '')
        return shortDesc ? shortDesc : 'unknown'
    } catch (Exception ignored) {
        return 'unknown'
    }
}()

repositories {
    mavenCentral()
    maven { url = 'https://hub.spigotmc.org/nexus/content/repositories/snapshots/' }
    maven { url = 'https://repo.extendedclip.com/content/repositories/placeholderapi/' }
    maven { url = 'https://repo.codemc.org/repository/maven-public' }
    maven { url = 'https://repo.papermc.io/repository/maven-public/' }
    maven { url = 'https://repo.aikar.co/content/groups/aikar/' }
    maven { url = 'https://maven.enginehub.org/repo/' }
    maven { url = 'https://nexus.scarsz.me/content/groups/public/' }
    maven { url = 'https://eldonexus.de/repository/maven-public' }
    maven { url = 'https://jitpack.io' }
}

dependencies {
    // --- Bundled into the final jar (Maven "compile" scope) ---
    implementation 'org.bstats:bstats-bukkit:3.0.2'
    implementation 'io.papermc:paperlib:1.0.8-SNAPSHOT'
    implementation 'co.aikar:acf-paper:0.5.1-SNAPSHOT'
    implementation 'com.github.cryptomorin:XSeries:13.8.0'
    implementation 'com.google.code.gson:gson:2.10.1'
    // HikariCP 4.0.3: last version compatible with Java 8
    implementation 'com.zaxxer:HikariCP:4.0.3'

    // --- Not bundled (Maven "provided" scope); annotations excluded from shading ---
    compileOnly 'org.spigotmc:spigot-api:1.16.4-R0.1-SNAPSHOT'
    compileOnly('com.github.MilkBowl:VaultAPI:1.7') {
        // No idea why, but it fails JUnit 5 tests
        exclude group: 'com.googlecode.json-simple', module: 'json-simple'
    }
    compileOnly 'me.clip:placeholderapi:2.11.7'
    compileOnly 'org.jetbrains:annotations:24.0.1'
    compileOnly 'com.sk89q:worldguard:6.1.1-SNAPSHOT'
    compileOnly 'com.github.TechFortress:GriefPrevention:17.0.0'
    compileOnly 'com.discordsrv:discordsrv:1.28.0'
    compileOnly 'biz.princeps:landlord-latest:4.363'
    // landlord-latest pulls the API via a `runtime`-scoped transitive dep, which Gradle keeps
    // off the compile classpath (unlike Maven). Add the API module explicitly for compilation.
    compileOnly 'biz.princeps:landlord-api:4.363'

    // --- Tests ---
    testCompileOnly 'org.jetbrains:annotations:24.0.1'
    testImplementation 'org.spigotmc:spigot-api:1.16.4-R0.1-SNAPSHOT'
    testImplementation 'org.junit.jupiter:junit-jupiter-api:5.11.3'
    testImplementation 'org.mockito:mockito-core:5.14.2'
    testRuntimeOnly 'org.junit.jupiter:junit-jupiter-engine:5.11.3'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher:1.11.3'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 8
    options.deprecation = true
    options.compilerArgs += ['-parameters']
}

processResources {
    filteringCharset = 'UTF-8'
    def tokens = [
            'project.version'             : version.toString(),
            'git.commit.id.describe-short': gitDescribeShort
    ]
    inputs.property 'tokens', tokens
    // Only plugin.yml uses ${...} tokens; keep other resources (message bundles) byte-for-byte
    filesMatching('plugin.yml') {
        filter { String line ->
            String result = line
            tokens.each { k, v -> result = result.replace('${' + k + '}', v) }
            return result
        }
    }
}

test {
    useJUnitPlatform()
}

shadowJar {
    archiveBaseName = 'SimpleClans'
    archiveClassifier = ''
    archiveVersion = ''

    relocate 'org.bstats', 'net.sacredlabyrinth.phaed.simpleclans.metrics'
    relocate 'io.papermc.lib', 'net.sacredlabyrinth.phaed.simpleclans.paperlib'
    relocate 'co.aikar.commands', 'net.sacredlabyrinth.phaed.simpleclans.acf'
    relocate 'co.aikar.locales', 'net.sacredlabyrinth.phaed.simpleclans.locales'
    relocate 'com.cryptomorin.xseries', 'net.sacredlabyrinth.phaed.simpleclans.xseries'
    relocate 'com.google.gson', 'net.sacredlabyrinth.phaed.simpleclans.gson'
    relocate 'com.zaxxer.hikari', 'net.sacredlabyrinth.phaed.simpleclans.hikari'
    relocate 'org.slf4j', 'net.sacredlabyrinth.phaed.simpleclans.slf4j'
}

// Make `build` produce the shaded jar (Maven shade ran on `package`)
tasks.named('assemble') {
    dependsOn tasks.named('shadowJar')
}

javadoc {
    options.encoding = 'UTF-8'
    if (options instanceof StandardJavadocDocletOptions) {
        options.addStringOption('Xdoclint:all,-missing', '-quiet')
    }
}

// Optional: deploy the built jar to a local test server (replaces the Maven dependency-plugin copy)
def testServer = System.getenv('TEST_SERVER')
if (testServer) {
    tasks.register('deployToTestServer', Copy) {
        from tasks.named('shadowJar')
        into "${testServer}/plugins"
    }
    tasks.named('shadowJar').configure { finalizedBy 'deployToTestServer' }
}

// Upstream distribution (Maven distributionManagement -> reposilite)
publishing {
    publications {
        maven(MavenPublication) {
            artifactId = 'SimpleClans'
            from components.java
        }
    }
    repositories {
        maven {
            name = 'reposilite'
            url = version.toString().endsWith('SNAPSHOT')
                    ? 'https://repo.roinujnosde.me/snapshots/'
                    : 'https://repo.roinujnosde.me/releases/'
            credentials {
                username = System.getenv('REPOSILITE_USER')
                password = System.getenv('REPOSILITE_PASSWORD')
            }
        }
    }
}
