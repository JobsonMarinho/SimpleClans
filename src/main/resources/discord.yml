# =====================================================================
#  SimpleClans - Sistema de Webhooks / Auditoria via Discord
# =====================================================================
#  - Tudo é enviado de forma ASSÍNCRONA. Falha no Discord NUNCA afeta
#    clãs, membros, alianças ou o banco de dados.
#  - Falhas são registradas em logs/discord.log.
#  - Anti-flood com cooldown por jogador, por evento, fila e agrupamento.
#  - Cores de embed em formato DECIMAL (ex.: 5763719 = verde Discord).
#  - Avatares/skins via Minotar (placeholders {*_avatar_url}).
#
#  Placeholders disponíveis (variam por evento; ausentes viram "—"):
#    {player} {uuid} {player_avatar_url}     -> quem fez a ação
#    {target} {target_uuid} {target_avatar_url} -> jogador afetado
#    {staff} {staff_uuid} {staff_avatar_url} -> staff responsável
#    {clan} {tag} {clan2} {tag2}             -> clãs envolvidos
#    {old_tag} {new_tag} {old_value} {new_value}
#    {action} {reason} {clans} {context} {detail}
#    {date} {server}
# =====================================================================

discord:
  enabled: false

  # -------------------------------------------------------------------
  #  Múltiplos webhooks (cada evento aponta para um destes por nome).
  #    alerts    -> atividade normal dos clãs
  #    staff     -> auditoria de comandos administrativos
  #    technical -> erros técnicos
  # -------------------------------------------------------------------
  webhooks:
    alerts:
      enabled: true
      url: ""
    staff:
      enabled: true
      url: ""
    technical:
      enabled: true
      url: ""

  # -------------------------------------------------------------------
  #  Comportamento de envio HTTP.
  # -------------------------------------------------------------------
  settings:
    timeout-ms: 5000
    retry-on-fail: true
    max-retries: 2
    # Intervalo mínimo entre envios por webhook (Discord: ~30 req/min).
    min-send-interval-ms: 2000
    log-failures: true
    log-file: "logs/discord.log"
    # Nome exibido como autor da mensagem.
    username: "SimpleClans"

  # -------------------------------------------------------------------
  #  Anti-flood global.
  # -------------------------------------------------------------------
  anti-flood:
    enabled: true
    # Eventos HIGH/CRITICAL ignoram o anti-flood.
    ignore-anti-flood-for-critical: true

    per-player:
      enabled: true
      cooldown-seconds: 10

    per-event:
      enabled: true
      cooldown-seconds: 3

    queue:
      enabled: true
      max-size: 100
      flush-interval-seconds: 5

    aggregate:
      enabled: true
      same-event-window-seconds: 30

    # Janela de deduplicação de erros técnicos repetidos (segundos).
    technical-dedupe-seconds: 300

  # -------------------------------------------------------------------
  #  Menção de cargo para eventos de prioridade alta.
  # -------------------------------------------------------------------
  priority:
    mention-role:
      enabled: false
      role-id: "123456789"
      only-for:
        - "technical-error"

  # -------------------------------------------------------------------
  #  Avatar / skin do jogador (Minotar).
  # -------------------------------------------------------------------
  player-avatar:
    enabled: true
    provider: "minotar"

    minotar:
      # Usa UUID (imune a troca de nick) em vez do nick como identificador.
      # Obs.: contas Bedrock (Floodgate) podem não resolver skin no Minotar.
      use-uuid: true

      # avatar = cabeça | helm = cabeça+capacete | cube = isométrica
      # body = corpo inteiro | bust = busto | skin = skin completa
      type: "helm"
      size: 100

      urls:
        avatar: "https://minotar.net/avatar/{identifier}/{size}.png"
        helm: "https://minotar.net/helm/{identifier}/{size}.png"
        cube: "https://minotar.net/cube/{identifier}/{size}.png"
        body: "https://minotar.net/body/{identifier}/{size}.png"
        bust: "https://minotar.net/bust/{identifier}/{size}.png"
        skin: "https://minotar.net/skin/{identifier}"

    fallback:
      enabled: true
      identifier: "MHF_Steve"

  # ===================================================================
  #  EVENTOS
  #  Eventos ausentes deste arquivo nunca disparam.
  #  Observação: uma expulsão também gera "player-left" (a saída em si);
  #  desligue um dos dois se preferir apenas um registro.
  # ===================================================================
  events:

    # ---------------- Ciclo de vida do clã --------------------------
    clan-created:
      enabled: true
      webhook: "alerts"
      priority: "MEDIUM"
      use-player-avatar: true
      embed:
        title: "🏰 Clã criado"
        color: 5763719
        description:
          - "**Clã:** {clan}"
          - "**TAG:** {tag}"
          - "**Líder:** {player}"
          - "**UUID:** `{uuid}`"
          - ""
          - "**Servidor:** {server}"
          - "**Data:** {date}"
        thumbnail:
          enabled: true
          url: "{player_avatar_url}"
        footer: "SimpleClans • Clãs"

    clan-disbanded:
      enabled: true
      webhook: "alerts"
      priority: "MEDIUM"
      use-player-avatar: true
      embed:
        title: "💥 Clã deletado"
        color: 15548997
        description:
          - "**Clã:** {clan}"
          - "**TAG:** {tag}"
          - "**Deletado por:** {player}"
          - "**UUID:** `{uuid}`"
          - ""
          - "**Servidor:** {server}"
          - "**Data:** {date}"
        thumbnail:
          enabled: true
          url: "{player_avatar_url}"
        footer: "SimpleClans • Clãs"

    clan-disbanded-staff:
      enabled: true
      webhook: "staff"
      priority: "HIGH"
      use-player-avatar: true
      embed:
        title: "💥 Clã deletado pela staff"
        color: 15548997
        description:
          - "**Staff:** {staff}"
          - "**UUID do staff:** `{staff_uuid}`"
          - ""
          - "**Clã:** {clan}"
          - "**TAG:** {tag}"
          - ""
          - "**Servidor:** {server}"
          - "**Data:** {date}"
        thumbnail:
          enabled: true
          url: "{staff_avatar_url}"
        footer: "SimpleClans • Auditoria administrativa"

    tag-changed:
      enabled: true
      webhook: "alerts"
      priority: "HIGH"
      use-player-avatar: true
      embed:
        title: "🏷️ TAG alterada"
        color: 3447003
        description:
          - "**Clã:** {clan}"
          - "**TAG anterior:** {old_tag}"
          - "**Nova TAG:** {new_tag}"
          - "**Alterada por:** {player}"
          - ""
          - "**Data:** {date}"
        thumbnail:
